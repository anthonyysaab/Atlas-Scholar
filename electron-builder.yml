appId: com.readingassistant.app
productName: Reading Assistant
copyright: Copyright © 2026 Reading Assistant
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
compression: normal
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: build/icon.png
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
  # No Apple Developer ID: ad-hoc sign so Apple Silicon will launch it. Hardened runtime would
  # reject the ad-hoc-signed Electron framework (library validation needs a Team ID).
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  icon: build/icon.png
  category: Office
  synopsis: Read documents and ask an LLM about them
  maintainer: Reading Assistant
  executableName: reading-assistant
  syncDesktopName: true
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Reading Assistant
  uninstallDisplayName: Reading Assistant
